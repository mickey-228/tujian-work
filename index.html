<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>你的职场动物图鉴</title>
<link rel="stylesheet" href="assets/crayon.css">
</head>
<body data-theme="work">
<main class="wrap">

  <section id="s-start">
    <header class="masthead">
      <span class="kicker" id="kicker"></span>
      <h1 id="title"></h1>
      <p class="lede" id="intro"></p>
      <div class="meta">
        <span><b id="qTotal">14</b> <span id="qUnit">题</span></span>
        <span>约 4 分钟</span>
        <span>无标准答案</span>
      </div>
    </header>
    <div class="card">
      <span class="tape"></span>
      <p class="lede" id="startNote"></p>
      <button class="btn" id="start"><span id="startLabel"></span> ✏️</button>
    </div>
  </section>

  <section id="s-quiz" class="hidden">
    <div class="card">
      <span class="tape tl"></span>
      <div class="progress">
        <span class="num" id="pnum"></span>
        <span class="bar"><i class="fill" id="pfill" style="width:7%"></i></span>
      </div>
      <span class="qtag" id="qtag"></span>
      <div class="q" id="qtext"></div>
      <div class="opts" id="opts"></div>
      <div class="nav">
        <button class="btn prev" id="prevBtn">← 上一题</button>
        <button class="btn" id="nextBtn"><span class="lbl">下一题</span> →</button>
      </div>
    </div>
  </section>

  <section id="s-result" class="hidden">
    <div class="card">
      <span class="tape tr"></span>
      <div class="result-head">
        <div class="plate" id="plate"></div>
        <span class="rcode" id="rcode"></span>
        <div class="rname" id="rname"></div>
        <div class="rtag" id="rtag"></div>
      </div>
      <p class="portrait" id="portrait"></p>
      <div class="detail" id="rdetail"></div>
      <div class="match" id="rmatch"></div>
      <div class="quote" id="rquote"></div>
      <div class="bars">
        <div class="bars-title">四型得分分布</div>
        <div id="rbars"></div>
      </div>
      <div class="cta" id="rcta"></div>
      <p class="disclaim" id="disclaimer"></p>
      <button class="btn ghost" id="again">↺ 再测一次</button>
    </div>
  </section>

  <div class="footer">图鉴系列 · 职场动物图鉴<br>趣味自测 · 不构成诊断</div>
</main>

<script>
window.QUIZ = {
  kicker: "打工人图鉴 · 第壹册｜工位",

  startNote: "这一册收录 <b>工蜂 · 狐狸 · 猫头鹰 · 企鹅</b> 四种工位物种。选你在办公室里的<b>真实样子</b>，不是你想成为的样子。",
  startLabel: "翻开图鉴",
  scoreUnit: " 分",
  matchTitle: "工位搭子图鉴",
  matchLabels: { good: "最好的搭子", bad: "最容易互相消耗" },

  results: {
    be: { glyph:"🐝", code:"NO.40 · 实干型", name:"工蜂型", tag:"活都干了，功劳不一定有",

      detail:[
        ["你平时会这样", ["埋头做事，很少主动表现自己","被安排什么就做什么，不太会拒绝","加班是常态，觉得「做不完是自己的问题」","心里有委屈，但很少说出来"]],
        ["为什么会这样", "你相信「把事做好」就够了。但在职场里，做事和被人看见，是两件需要分别用力的事。"],

        ["要警惕", "一直当「老黄牛」，容易被默认成理所当然。"]

      quote:"你不是不累，你只是觉得说出来也没用。" },
    fo: { glyph:"🦊", code:"NO.41 · 社交型", name:"狐狸型", tag:"活儿不一定最多，但人挺好",
      portrait:"你懂办公室的规矩——什么话该说、什么时候该出头、该跟谁走近。事情你不一定做最多，但领导记得住你，同事也愿意帮你。会来事，是你最硬的本事。",
      detail:[

        ["为什么会这样", "你看得很清楚：职场是人和人的合作。把关系经营好，事情自然好办。"],
        ["怎么对自己更好", ["别让「会来事」变成「只会来事」，硬实力才是底气","小心过度站队，风向一变容易摔"]],
        ["要警惕", "靠人情拿到的，也可能因为人情失去。"]
      ],
      match:{ best:"企鹅型——一个主外、一个主内，配合最默契。", worst:"猫头鹰型——TA 不吃你那套，你也带不动 TA。" },
      quote:"会做事是本事，让人看见也是。" },
    ow: { glyph:"🦉", code:"NO.42 · 清醒型", name:"猫头鹰型", tag:"上班清醒，下班消失",
      portrait:"你把工作看得很清楚：它只是一份工作。你效率高、话不多、准点走人，不参与八卦，也不轻易站队。你看起来冷淡，其实是把力气留给了自己真正在乎的事。",
      detail:[
        ["你平时会这样", ["准点上下班，绝不多待","不掺和办公室政治和闲聊","任务完成得干净，但不多做一分","对形式主义和画饼免疫"]],
        ["为什么会这样", "你分得清「工作」和「生活」，不把自我价值绑在职位上——这其实是很多人学不来的清醒。"],
        ["怎么对自己更好", ["适当的可见度也有用，别让低调变成透明","关键时刻表达一次立场，比一直沉默更安全"]],
        ["要警惕", "过度抽离，可能错过真正值得投入的机会。"]

        ["怎么对自己更好", ["先练习一句不那么伤人的「这次我不行」","分清「帮忙」和「被占用」"]],

      quote:"你值得被好好对待，不只是被需要。" }

  cta: {

    items: [

      "《活出生命的意义》——意义感从哪来，人怎么扛过难熬的阶段",

    ],
    foot: "想要完整精华 → <b>直接在本店铺橱窗购入</b>。"
  },
  questions: [
    { tag:"第 1 题 · 新任务", text:"接到一个新任务，你第一反应是？",

    { tag:"第 2 题 · 会议上", text:"开会的时候，你通常是？",
      opts:[ {label:"默默记下，回去落实", scores:{be:2}}, {label:"挑机会表达自己的想法", scores:{fo:2}}, {label:"很少发言，但心里有数", scores:{ow:2}}, {label:"有人争执时出来缓和一下", scores:{pe:2}} ] },
    { tag:"第 3 题 · 求助", text:"同事临时请你帮忙，你会？",
      opts:[ {label:"放下手头的活，先帮他", scores:{pe:2}}, {label:"看情况，先顾好自己的事", scores:{be:1,ow:1}}, {label:"答应，但顺势让他记住这个人情", scores:{fo:2}}, {label:"直说没空", scores:{ow:2}} ] },
    { tag:"第 4 题 · 加班", text:"关于加班，你的常态是？",
      opts:[ {label:"家常便饭，活没完就走不了", scores:{be:2}}, {label:"看值不值得，能给领导看见就加", scores:{fo:2}}, {label:"尽量不加班，效率比时长重要", scores:{ow:2}}, {label:"别人没走，我也不好意思走", scores:{pe:2}} ] },

    { tag:"第 8 题 · 下班后", text:"下班之后，你的状态是？",

    { tag:"第 9 题 · 这份工作", text:"你心里怎么定义这份工作？",

    { tag:"第 10 题 · 评优", text:"年终评优，你会？",

    { tag:"第 11 题 · 下班点", text:"晚上 6 点，你的工位？",

<script src="assets/quiz.js"></script>
</body>
</html>
